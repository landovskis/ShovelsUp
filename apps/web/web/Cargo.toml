[package]
name = "shovelsup-web"
version = "0.1.0"
edition = "2021"

[lib]
name = "shovelsup_web"
path = "src/lib.rs"

[[bin]]
name = "shovelsup-web"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "compression-full", "trace"] }
minijinja = { version = "2", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
bcrypt = "0.15"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
thiserror = "1"
base64 = "0.22"
shovelsup-domain = { path = "../domain" }
shovelsup-pipeline = { path = "../pipeline" }
# IMP-REQ-006-04: used by resolve_citation_view's URL-shape reliability
# heuristic (routes/projects.rs) to robustly detect a query string via
# Url::query() and inspect path segments for a "session" component, rather
# than naive substring matching (which would mis-parse edge cases like a
# fragment containing "?" or a literal "session" appearing in a filename).
url = "2"

[dev-dependencies]
wiremock = "0.6"
once_cell = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["test-util"] }
